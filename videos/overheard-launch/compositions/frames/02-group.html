  <script>
    (function () {
      "use strict";

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var column = document.getElementById("f02-group-column");
      var stage = document.getElementById("f02-group-stage");
      var panel = document.getElementById("f02-group-panel");

      var rows = [];
      var metas = [];
      var i;
      for (i = 0; i < 4; i += 1) {
        rows.push(document.getElementById("f02-group-row-" + i));
        metas.push(document.getElementById("f02-group-meta-" + i));
      }

      // one cue per message — a live thread, not a single stagger burst
      var CUES = [0.2, 1.75, 3.35, 4.95];
      var META_LAG = 0.38;
      var WINDOW_H = 688; // 812 panel - 124 header
      var PAD_BOTTOM = 30;
      var ROW_FALLBACK = 126;
      var GAP = 22;

      // resting Y of the column after message k is seated (stack anchored bottom)
      function bottomOf(index) {
        var row = rows[index];
        var top = row.offsetTop;
        var height = row.offsetHeight;
        if (!height) {
          top = index * (ROW_FALLBACK + GAP);
          height = ROW_FALLBACK;
        }
        return top + height;
      }

      var restY = [];
      for (i = 0; i < rows.length; i += 1) {
        restY.push(WINDOW_H - PAD_BOTTOM - bottomOf(i));
      }

      // vertical-spring-ticker: the stack steps up one slot per cue and lands.
      // The first step is a fromTo so restY[0] is the correct state at t = 0 under seek.
      tl.fromTo(
        column,
        { y: restY[0] },
        { y: restY[1], duration: 0.5, ease: "power3.out" },
        CUES[1],
      );
      for (i = 2; i < restY.length; i += 1) {
        tl.to(column, { y: restY[i], duration: 0.5, ease: "power3.out" }, CUES[i]);
      }

      // ── Scene 1 (0.0–1.6s) — ground + panel settle, Mert Gökhan already resting
      tl.fromTo(
        panel,
        { opacity: 0, scale: 0.975 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" },
        0,
      );

      // slow camera push across the whole shot (multi-phase-camera, steady-push phase)
      tl.fromTo(
        stage,
        { scale: 1 },
        { scale: 1.022, duration: 9, ease: "power1.inOut" },
        0,
      );

      // ── Scenes 1–4 — one message cued at a time; the stack steps up to receive it
      for (i = 0; i < rows.length; i += 1) {
        tl.fromTo(
          rows[i],
          { opacity: 0 },
          { opacity: 1, duration: 0.26, ease: "power2.out" },
          CUES[i],
        );
        tl.fromTo(
          metas[i],
          { opacity: 0 },
          { opacity: 1, duration: 0.3, ease: "power2.out" },
          CUES[i] + META_LAG,
        );
      }

      // ── Scene 5 (6.6–9.0s) — held. Only the typing dots stay alive.
      var dots = [
        document.getElementById("f02-group-dot-0"),
        document.getElementById("f02-group-dot-1"),
        document.getElementById("f02-group-dot-2"),
      ];
      // bounded sine idle, authored as explicit tweens (no repeat / yoyo / clock)
      var PERIOD = 1.15;
      var CYCLES = 7; // 0.767 + 7 × 1.15 = 8.82s — inside the 9s window
      for (var d = 0; d < dots.length; d += 1) {
        var lead = (d * PERIOD) / 3;
        tl.set(dots[d], { opacity: 0.34, scale: 0.8 }, 0);
        for (var c = 0; c < CYCLES; c += 1) {
          var at = lead + c * PERIOD;
          tl.to(
            dots[d],
            { opacity: 1, scale: 1.14, duration: PERIOD / 2, ease: "sine.inOut" },
            at,
          );
          tl.to(
            dots[d],
            { opacity: 0.34, scale: 0.8, duration: PERIOD / 2, ease: "sine.inOut" },
            at + PERIOD / 2,
          );
        }
      }

      window.__timelines["02-group"] = tl;
    })();
