    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        "use strict";
        var root = document.querySelector('[data-composition-id="05-ask"]') || document.getElementById("root");
        var q = function (s) { return root.querySelector(s); };
        var qa = function (s) { return Array.prototype.slice.call(root.querySelectorAll(s)); };
        var DUR = 10;

        // Deterministic keystroke rhythm: one fixed-seed LCG, consumed in a single
        // synchronous pass. The only "randomness" here, identical on every build.
        var lcg = 0x2f6e2b17 >>> 0;
        function rnd() {
          lcg = (Math.imul(1664525, lcg) + 1013904223) >>> 0;
          return lcg / 4294967296;
        }

        // ONE text-at-time table covering both questions and both clears. A single
        // driver reads it, so forward, backward and repeated seeks resolve the same
        // string — nothing is incremental.
        var rows = [{ t: 0, x: "" }];
        function typeInto(text, startT, endT) {
          var first = rows.length;
          var t = startT;
          var acc = "";
          var words = text.split(" ");
          for (var wi = 0; wi < words.length; wi += 1) {
            var w = words[wi];
            if (wi > 0) { acc += " "; t += 0.05 + rnd() * 0.06; }
            var i = 0;
            while (i < w.length) {
              var n = 1 + Math.floor(rnd() * 3);
              var chunk = w.slice(i, i + n);
              i += n;
              t += chunk.length * (0.042 + rnd() * 0.032);
              acc += chunk;
              rows.push({ t: t, x: acc });
            }
          }
          // Fit the natural cadence to the authored window proportionally — never
          // gsap.timeScale(), never spilling into the next beat.
          var natural = rows[rows.length - 1].t;
          if (natural > startT) {
            var f = (endT - startT) / (natural - startT);
            for (var k = first; k < rows.length; k += 1) {
              rows[k].t = startT + (rows[k].t - startT) * f;
            }
          }
        }

        var Q1_START = 1.4, Q1_END = 2.78, Q1_SUBMIT = 2.82;
        var Q2_START = 5.3, Q2_END = 6.74, Q2_SUBMIT = 6.78;
        typeInto("what's due today?", Q1_START, Q1_END);
        rows.push({ t: Q1_SUBMIT, x: "" });
        typeInto("close the seed fixture one", Q2_START, Q2_END);
        rows.push({ t: Q2_SUBMIT, x: "" });

        function textAt(time) {
          for (var i = rows.length - 1; i >= 0; i -= 1) {
            if (time >= rows[i].t - 0.001) return rows[i].x;
          }
          return "";
        }

        var textEl = q("#ask05-text"), caretEl = q("#ask05-caret");
        var panel = q("#ask05-panel"), checkPath = q("#ask05-check");
        var CHECK_LEN = 22;
        textEl.textContent = "";

        gsap.set(panel, { x: 620, opacity: 0 });
        gsap.set("#ask05-veil", { opacity: 0 });
        gsap.set(["#ask05-head", "#ask05-headrule"], { opacity: 0 });
        gsap.set("#ask05-input", { opacity: 0, scale: 0.96 });
        gsap.set(caretEl, { opacity: 0 });
        gsap.set(["#ask05-q1", "#ask05-q2", "#ask05-reply", "#ask05-dots"], { opacity: 0 });
        gsap.set(qa(".ask05-w"), { opacity: 0 });
        gsap.set(qa(".ask05-due"), { opacity: 0 });
        gsap.set(qa(".ask05-rule"), { scaleY: 0 });
        gsap.set(qa(".ask05-sep"), { opacity: 0 });
        gsap.set(["#ask05-flash-yasin", "#ask05-flash-gokhan", "#ask05-spill", "#ask05-grey", "#ask05-count", "#ask05-total"], { opacity: 0 });
        gsap.set("#ask05-strike", { scaleX: 0 });
        gsap.set(checkPath, { strokeDasharray: CHECK_LEN, strokeDashoffset: CHECK_LEN });

        var tl = gsap.timeline({ paused: true });

        // --- the two table-driven passes, each one continuous sweep of the shot ---
        var typeDriver = { t: 0 };
        tl.to(typeDriver, { t: DUR, duration: DUR, ease: "none", onUpdate: function () {
          textEl.textContent = textAt(typeDriver.t);
        } }, 0);

        // Caret: an INTEGER number of sine cycles across the whole shot, so the
        // blink is identical on every seek and still alive through the final hold.
        var blink = { p: 0 };
        tl.to(blink, { p: Math.PI * 2 * 11, duration: DUR, ease: "none", onUpdate: function () {
          caretEl.style.opacity = Math.sin(blink.p) >= 0 ? "1" : "0";
        } }, 0);

        // ===== Scene 1 (0.0-1.4) — board holds; the agent sidebar slides in =====
        tl.to(panel, { x: 0, duration: 0.85, ease: "power3.out" }, 0.1);
        tl.to(panel, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.1);
        tl.to("#ask05-veil", { opacity: 1, duration: 1, ease: "power1.inOut" }, 0.25);
        tl.fromTo("#ask05-head", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.62);
        tl.fromTo("#ask05-headrule", { opacity: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1, duration: 0.45, ease: "power2.out" }, 0.7);
        tl.fromTo("#ask05-input", { opacity: 0, scale: 0.94, y: 14 }, { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "back.out(1.7)" }, 0.92);
        tl.to(caretEl, { opacity: 1, duration: 0.12 }, 1.22);

        // ===== Scene 2 (1.4-3.2) — "what's due today?" types, submits, thinks =====
        tl.to("#ask05-send", { scale: 0.84, duration: 0.07, ease: "power2.in" }, Q1_SUBMIT - 0.08);
        tl.to("#ask05-send", { scale: 1, duration: 0.32, ease: "back.out(3)" }, Q1_SUBMIT - 0.01);
        tl.fromTo("#ask05-q1", { opacity: 0, scale: 0.88, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(1.8)" }, Q1_SUBMIT + 0.02);
        tl.fromTo("#ask05-dots", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out" }, 2.96);
        var dots = qa("#ask05-dots i");
        var pulse = { p: 0 };
        tl.to(pulse, { p: Math.PI * 2 * 2, duration: 0.34, ease: "none", onUpdate: function () {
          for (var i = 0; i < dots.length; i += 1) {
            dots[i].style.opacity = (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(pulse.p - i * 1.5))).toFixed(3);
          }
        } }, 2.96);
        tl.to("#ask05-dots", { opacity: 0, duration: 0.12, ease: "power1.in" }, 3.22);

        // ===== Scene 3 (3.2-5.2) — the answer streams; each row flashes its card =====
        var rowPlan = [
          { sel: "#ask05-row1", start: 3.3, sep: null },
          { sel: "#ask05-row2", start: 3.96, sep: "#ask05-sep1" },
          { sel: "#ask05-row3", start: 4.54, sep: "#ask05-sep2" }
        ];
        var landed = [];
        rowPlan.forEach(function (plan) {
          var rowEl = q(plan.sel);
          tl.fromTo(rowEl.querySelector(".ask05-rule"), { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power2.out" }, plan.start - 0.04);
          if (plan.sep) tl.to(plan.sep, { opacity: 1, duration: 0.25, ease: "power1.out" }, plan.start - 0.06);
          var t = plan.start;
          Array.prototype.slice.call(rowEl.querySelectorAll(".ask05-w")).forEach(function (wordEl) {
            tl.fromTo(wordEl, { opacity: 0, y: 9 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, t);
            t += 0.055 + rnd() * 0.075; // uneven token rhythm, same seeded stream
          });
          tl.fromTo(rowEl.querySelector(".ask05-due"), { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.26, ease: "back.out(2.2)" }, t + 0.04);
          landed.push(t + 0.06);
        });

        // Row 1 -> Gokhan's real card. It stays faintly lit: it is the card the
        // second ask is about to close.
        tl.fromTo("#ask05-flash-gokhan", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, landed[0]);
        tl.to("#ask05-flash-gokhan", { opacity: 0.3, duration: 0.4, ease: "power2.inOut" }, landed[0] + 0.2);
        // Row 2 -> Yasin's real card.
        tl.fromTo("#ask05-flash-yasin", { opacity: 0 }, { opacity: 1, duration: 0.14, ease: "power2.out" }, landed[1]);
        tl.to("#ask05-flash-yasin", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, landed[1] + 0.28);
        // Row 3 -> Sefa's column sits behind the panel; the accent spills past its edge.
        tl.fromTo("#ask05-spill", { opacity: 0 }, { opacity: 1, duration: 0.16, ease: "power2.out" }, landed[2]);
        tl.to("#ask05-spill", { opacity: 0, duration: 0.55, ease: "power2.inOut" }, landed[2] + 0.3);

        // ===== Scene 4 (5.2-7.0) — the second ask types into the same input =====
        tl.to("#ask05-send", { scale: 0.84, duration: 0.07, ease: "power2.in" }, Q2_SUBMIT - 0.08);
        tl.to("#ask05-send", { scale: 1, duration: 0.32, ease: "back.out(3)" }, Q2_SUBMIT - 0.01);
        tl.fromTo("#ask05-q2", { opacity: 0, scale: 0.88, y: 12 }, { opacity: 1, scale: 1, y: 0, duration: 0.32, ease: "back.out(1.8)" }, Q2_SUBMIT + 0.02);
        tl.to("#ask05-flash-gokhan", { opacity: 0.85, duration: 0.26, ease: "power2.out" }, Q2_SUBMIT);

        // ===== Scene 5 (7.0-8.6) — "Closed.", and the board changes underneath =====
        tl.fromTo("#ask05-reply", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.34, ease: "power3.out" }, 7.1);
        tl.to(checkPath, { strokeDashoffset: 0, duration: 0.28, ease: "power2.out" }, 7.24);
