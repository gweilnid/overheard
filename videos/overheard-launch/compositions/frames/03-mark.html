    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var WORLD = "#mk-world";
        var CARD = "#mk-card";
        var RING = "#mk-card-ring";
        var blurNode = document.getElementById("mk-blur");
        var world = document.getElementById("mk-world");

        /* ---------------------------------------------------------------
         * SEEK LAW (learned the hard way on this project): the renderer
         * seeks with suppressEvents, so an onUpdate callback NEVER fires —
         * anything drawn from onUpdate renders frozen. So the camera is
         * ONE element (#mk-world) whose x / y / scale are tweened directly
         * by GSAP's own transform writer, every leg a baked `fromTo` with
         * explicit numbers. Nothing derives visible state from a callback;
         * the blur envelope rides an attr tween + zero-duration `set`s.
         * Any seek therefore reproduces the exact mid-leg camera pose.
         *
         * Composite: screen = scale * (world - centre) + centre + (x, y),
         * i.e. viewport-change's single wrapper with T = -offset * S.
         * ------------------------------------------------------------- */
        var tl = gsap.timeline({ paused: true });
        tl.to({}, { duration: 10 }, 0); // hold the full render length

        // identity pose + sharp world at t = 0 (straight cut in from frame 02)
        tl.set(WORLD, { x: 0, y: 0, scale: 1 }, 0);
        tl.set(world, { filter: "none" }, 0);
        tl.set(RING, { opacity: 0 }, 0);

        /* =============================================================
         * SCENE 1 (0.0–1.4s) — LEG 1: the slow dive.
         * The camera pushes onto Yasin's message until it commits to that
         * one sentence. Pose derived from the baked layout:
         *   Yasin bubble world box  left 397, top 618, height 92
         *   bubble centre offset y  = 618 + 46 - 540 = 124
         *   S = 2.35, bubble centre lands at screen y 430
         *   cam.y = 430 - 540 - S*124 = -401
         *   cam.x = 430 puts the panel's left edge just off-frame
         * ============================================================= */
        var DIVE = { scale: 2.35, x: 430, y: -401 };
        var EZ = "power3.inOut";

        tl.fromTo(WORLD, { scale: 1 }, { scale: DIVE.scale, duration: 1.4, ease: EZ, immediateRender: false }, 0);
        tl.fromTo(WORLD, { x: 0 }, { x: DIVE.x, duration: 1.4, ease: EZ, immediateRender: false }, 0);
        tl.fromTo(WORLD, { y: 0 }, { y: DIVE.y, duration: 1.4, ease: EZ, immediateRender: false }, 0);

        /* =============================================================
         * SCENE 2 (1.4–2.6s) — THE HINGE. The mark.
         * The camera is dead still. The chip is the only thing in the
         * whole film that moves with a spring, and the only thing moving
         * in this window. The agent writes nothing into the chat.
         * ============================================================= */
        tl.fromTo("#mk-chip", { scale: 0, opacity: 0, y: -16 },
          { scale: 1, opacity: 1, y: 0, duration: 0.52, ease: "back.out(1.7)" }, 1.52);
        /* the soft impact — one ring, no sound in this film */
        tl.fromTo("#mk-chip-ring", { scale: 0.62, opacity: 0.55 },
          { scale: 1.34, opacity: 0, duration: 0.62, ease: "power2.out", immediateRender: false }, 1.66);

        /* =============================================================
         * SCENE 3 (2.6–4.6s) — LEG 2: the swoop to the consequence.
         * One continuous move: the camera pulls out of the dive and
         * travels right; the thread slides out of frame left, the board
         * plate travels in behind it. Motion blur peaks through the
         * middle of the leg and resolves sharp on the landing.
         *
         * The scale pull is front-loaded (lands at 1.0 by t=3.10) so the
         * 1920x1080 capture is NEVER on screen above 1x — it first
         * crosses the right edge at t≈3.33, already at 1.0.
         * ============================================================= */
        var LEG = 2.6;
        var FROM_X = DIVE.x;
        var TO_X = -1960; // board centre offset is +1960 → T = -1960 at S=1
        var RAMP = FROM_X + (TO_X - FROM_X) * 0.07;
        var BURST = FROM_X + (TO_X - FROM_X) * 0.52;

        // pull out of the dive first (scale + y share window and ease)
        tl.fromTo(WORLD, { scale: DIVE.scale }, { scale: 1, duration: 0.5, ease: EZ, immediateRender: false }, LEG);
        tl.fromTo(WORLD, { y: DIVE.y }, { y: 0, duration: 0.5, ease: EZ, immediateRender: false }, LEG);

        // the lateral travel — ramp / linear burst / hard-decelerating tail
        tl.fromTo(WORLD, { x: FROM_X }, { x: RAMP, duration: 0.45, ease: "power2.in", immediateRender: false }, LEG);
        tl.fromTo(WORLD, { x: RAMP }, { x: BURST, duration: 0.49, ease: "none", immediateRender: false }, LEG + 0.45);
        tl.fromTo(WORLD, { x: BURST }, { x: TO_X, duration: 1.05, ease: "power4.out", immediateRender: false }, LEG + 0.95);

        /* blur envelope (motion-blur-streak, camera-travel carve-out).
         * The filter is switched ON only for the leg so the 1:1 board
         * plate is never resampled once it is at rest. The stdDeviation
         * is an attr tween — rendered by GSAP itself, not a callback. */
        tl.set(world, { filter: "url(#mk-streak)" }, LEG);
        tl.fromTo(blurNode, { attr: { stdDeviation: "0 0" } },
          { attr: { stdDeviation: "18 0" }, duration: 0.45, ease: "power2.in", immediateRender: false }, LEG);
        tl.fromTo(blurNode, { attr: { stdDeviation: "18 0" } },
          { attr: { stdDeviation: "0 0" }, duration: 1.05, ease: "power4.out", immediateRender: false }, LEG + 0.95);
        tl.set(world, { filter: "none" }, 4.6);

        // third plane: the thread is the foreground, so it leaves faster
        tl.fromTo("#mk-chat", { x: 0, scale: 1 },
          { x: -240, scale: 1.06, duration: 1.1, ease: "power2.in", immediateRender: false }, LEG);

        /* =============================================================
         * SCENE 4 (4.6–6.6s) — the card, READ.
         * The plate is at rest at 1:1 and recedes behind a cream scrim,
         * and the card the sentence became materialises LARGE and centred
         * over it — the same element that will dock, held at scale 3
         * (864x312, 45% of frame, centred at 960/330). What, tag, quote:
         * the verbatim promise, at a size you actually read. The build
         * finishes at 5.60 and NOTHING moves until 6.60 — a full second
         * of dead-still reading on top of the ~0.8s the build itself
         * leaves legible. The scrim rises WITH the card (not ahead of
         * it), so the plate is never seen dimming on its own.
         *
         * Docked centre is board-local (172, 396) → screen (172, 396).
         * HERO.x = 960 - 172 = 788 ; HERO.y = 330 - 396 = -66.
         * ============================================================= */
        var HERO = { scale: 3, x: 788, y: -66 };

        tl.fromTo("#mk-dim", { opacity: 0 }, { opacity: 0.58, duration: 0.7, ease: "power2.out" }, 4.5);

        tl.fromTo(CARD, { x: HERO.x, y: HERO.y, scale: HERO.scale * 0.93, opacity: 0 },
          { x: HERO.x, y: HERO.y, scale: HERO.scale, opacity: 1, duration: 0.45, ease: "power3.out" }, 4.6);
        tl.fromTo(RING, { x: HERO.x, y: HERO.y, scale: HERO.scale * 0.96, opacity: 0.9 },
          { x: HERO.x, y: HERO.y, scale: HERO.scale * 1.14, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, 4.62);
        tl.fromTo("#mk-card-what", { y: 8, opacity: 0 }, { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" }, 4.76);
        tl.fromTo("#mk-card-tag", { scale: 0.84, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.34, ease: "power3.out" }, 4.98);
        tl.fromTo("#mk-card-quote", { y: 7, opacity: 0 }, { y: 0, opacity: 1, duration: 0.42, ease: "power2.out" }, 5.18);
        // 5.60 → 6.60 : nothing moves. The quote is simply readable.

        /* =============================================================
         * SCENE 5 (6.6–8.4s) — the dock.
         * One continuous decelerating move: the card shrinks from 3.0 to
         * the plate's own 1.0 and travels down-left into its real slot in
         * the Yasin column, landing on the plate's geometry at the plate's
         * type size, outlined in `primary`. The scrim lifts as it lands,
         * so the board is back to full brightness the moment the card
         * becomes part of it. The vertical settle finishes last (8.4s) —
         * the card drops into the slot rather than sliding into it.
         * ============================================================= */
        var DOCK = 6.6;

        tl.fromTo(CARD, { x: HERO.x }, { x: 0, duration: 1.7, ease: "power3.inOut", immediateRender: false }, DOCK);
        tl.fromTo(CARD, { scale: HERO.scale }, { scale: 1, duration: 1.7, ease: "power3.inOut", immediateRender: false }, DOCK);
        tl.fromTo(CARD, { y: HERO.y }, { y: 0, duration: 1.8, ease: "power2.inOut", immediateRender: false }, DOCK);

        // the plate lifts back to full brightness as the card lands
        tl.fromTo("#mk-dim", { opacity: 0.58 }, { opacity: 0, duration: 1.7, ease: "power2.inOut", immediateRender: false }, DOCK);

        /* =============================================================
         * SCENE 6 (8.4–10.0s) — HELD. The outline settles from `primary`
         * to `border` and the card becomes an ordinary card among the
         * others. Everything is motionless from 9.3s to the cut, which is
         * the handoff frame 04 picks up: plate centred at 960/540,
         * scale 1.0, opacity 1, full brightness, dead still.
         * ============================================================= */
        tl.fromTo(CARD, { borderColor: "#F5401D" },
          { borderColor: "#EBEBF0", duration: 0.85, ease: "power2.inOut", immediateRender: false }, 8.45);

        window.__timelines["03-mark"] = tl;
      })();
    </script>
