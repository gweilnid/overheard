    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        var world = document.getElementById("mk-world");
        var blurNode = document.getElementById("mk-blur");

        /* ---------------------------------------------------------------
         * ONE camera state, ONE writer. Single-wrapper composite transform:
         *   screen = scale * worldOffset + cam  (viewport-change, T = -off*S)
         * Every leg is a tween on this object; nothing else writes
         * world.style.transform. Poses are baked constants, so any seek
         * reproduces the exact mid-leg pose.
         * ------------------------------------------------------------- */
        var cam = { scale: 1, x: 0, y: 0 };
        function applyCamera() {
          world.style.transform =
            "translate(" + cam.x + "px, " + cam.y + "px) scale(" + cam.scale + ")";
        }
        applyCamera();

        /* camera-travel blur envelope (motion-blur-streak, camera carve-out).
         * filter is switched OFF at rest so the 1:1 board plate stays
         * pixel-exact and is never resampled. */
        var blur = { v: 0 };
        function writeBlur() {
          if (blur.v <= 0.02) {
            world.style.filter = "none";
            blurNode.setAttribute("stdDeviation", "0 0");
          } else {
            blurNode.setAttribute("stdDeviation", blur.v + " 0");
            world.style.filter = "url(#mk-streak)";
          }
        }
        writeBlur();

        var tl = gsap.timeline({ paused: true });
        tl.to({}, { duration: 8 }, 0); // hold the full render length

        /* =============================================================
         * SCENE 1 (0.0–1.4s) — LEG 1: the slow dive.
         * Straight cut in from frame 02: cam is identity at t=0, so the
         * thread is framed exactly as frame 02 left it. The camera pushes
         * onto Yasin's message until it commits to that one sentence.
         * Pose is derived from the baked layout:
         *   Yasin bubble world box  left 397, top 618, height 92
         *   bubble centre offset y  = 618 + 46 - 540 = 124
         *   S = 2.35, bubble centre lands at screen y 430
         *   cam.y = 430 - 540 - S*124 = -401
         *   cam.x = 430 puts the panel's left edge just off-frame
         * ============================================================= */
        var DIVE = { scale: 2.35, x: 430, y: -401 };

        tl.to(
          cam,
          { scale: DIVE.scale, duration: 1.4, ease: "power3.inOut", onUpdate: applyCamera },
          0,
        );
        tl.to(cam, { x: DIVE.x, duration: 1.4, ease: "power3.inOut", onUpdate: applyCamera }, 0);
        tl.to(cam, { y: DIVE.y, duration: 1.4, ease: "power3.inOut", onUpdate: applyCamera }, 0);

        /* =============================================================
         * SCENE 2 (1.4–2.6s) — THE HINGE. The mark.
         * The camera is dead still. The ✍️ chip is the only thing in the
         * whole film that moves with a spring, and the only thing moving
         * in this window. The agent writes nothing into the chat.
         * ============================================================= */
        tl.fromTo(
          "#mk-chip",
          { scale: 0, opacity: 0, y: -16 },
          { scale: 1, opacity: 1, y: 0, duration: 0.52, ease: "back.out(1.7)" },
          1.52,
        );

        /* the soft impact — one ring, no sound in this film */
        tl.fromTo(
          "#mk-chip-ring",
          { scale: 0.62, opacity: 0.55 },
          { scale: 1.34, opacity: 0, duration: 0.62, ease: "power2.out", immediateRender: false },
          1.66,
        );

        /* =============================================================
         * SCENE 3 (2.6–4.6s) — LEG 2: the swoop to the consequence.
         * One continuous move: the camera pulls out of the dive and
         * travels right; the thread slides out of frame left, the board
         * plate travels in behind it. Motion blur peaks through the
         * middle of the leg and resolves sharp on the landing.
         *
         * The scale pull is front-loaded (lands at 1.0 by t=3.10) so the
         * 1920x1080 capture is NEVER on screen above 1x — it first
         * crosses the right edge at t≈3.33, already at 1.0.
         * ============================================================= */
        var LEG_AT = 2.6;
        var TRAVEL_FROM = DIVE.x; // 430
        var TRAVEL_TO = -1960; // board centre offset is +1960 → T = -1960 at S=1

        // pull out of the dive first (scale + y share window and ease)
        tl.to(cam, { scale: 1, duration: 0.5, ease: "power3.inOut", onUpdate: applyCamera }, LEG_AT);
        tl.to(cam, { y: 0, duration: 0.5, ease: "power3.inOut", onUpdate: applyCamera }, LEG_AT);

        // the lateral travel — ramp / linear burst / hard-decelerating tail
        var RAMP_TO = TRAVEL_FROM + (TRAVEL_TO - TRAVEL_FROM) * 0.07; // 232
        var BURST_TO = TRAVEL_FROM + (TRAVEL_TO - TRAVEL_FROM) * 0.52; // -1041.6
        tl.to(cam, { x: RAMP_TO, duration: 0.45, ease: "power2.in", onUpdate: applyCamera }, LEG_AT);
        tl.to(
          cam,
          { x: BURST_TO, duration: 0.49, ease: "none", onUpdate: applyCamera },
          LEG_AT + 0.45,
        );
        tl.to(
          cam,
          { x: TRAVEL_TO, duration: 1.05, ease: "power4.out", onUpdate: applyCamera },
          LEG_AT + 0.95,
        );

        // blur envelope rides the same windows: 0 → peak over the ramp,
        // held through the constant-velocity burst, peak → 0 over the tail
        tl.to(blur, { v: 18, duration: 0.45, ease: "power2.in", onUpdate: writeBlur }, LEG_AT);
        tl.to(
          blur,
          { v: 0, duration: 1.05, ease: "power4.out", onUpdate: writeBlur },
          LEG_AT + 0.95,
        );

        // third plane: the thread is the foreground, so it leaves faster
        tl.to(
          "#mk-chat",
          { x: -240, scale: 1.06, duration: 1.1, ease: "power2.in" },
          LEG_AT,
        );

        /* =============================================================
         * SCENE 4 (4.6–6.4s) — LANDING. The board rests at 1:1 and the
         * consequence renders as element motion: the card scales up into
         * the gap in the Yasin column, then builds row by row — what,
         * due tag, and the quote word-for-word off the bubble above.
         * No overshoot here; the spring was spent on the mark.
         * ============================================================= */
        tl.fromTo(
          "#mk-card",
          { scale: 0.86, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" },
          4.65,
        );
        tl.fromTo(
          "#mk-card-ring",
          { scale: 0.94, opacity: 0.85 },
          { scale: 1.12, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false },
          4.65,
        );
        tl.fromTo(
          "#mk-card-what",
          { y: 7, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" },
          4.95,
        );
        tl.fromTo(
          "#mk-card-tag",
          { scale: 0.82, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.34, ease: "power3.out" },
          5.22,
        );
        tl.fromTo(
          "#mk-card-quote",
          { y: 6, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.44, ease: "power2.out" },
          5.5,
        );

        /* =============================================================
         * SCENE 5 (6.4–8.0s) — HELD. The outline settles from `primary`
         * to `border` and the card becomes an ordinary card among the
         * others. Everything is motionless from 7.35s to the cut, which
         * is the handoff frame 04 picks up: plate centred at 960/540,
         * scale 1.0, opacity 1.
         * ============================================================= */
        tl.to(
          "#mk-card",
          {
            borderColor: "#EBEBF0",
            backgroundColor: "#FFFFFF",
            duration: 0.9,
            ease: "power2.inOut",
          },
          6.45,
        );

        window.__timelines["03-mark"] = tl;
      })();
