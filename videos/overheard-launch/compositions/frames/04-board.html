    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var root = document.currentScript
          ? document.currentScript.closest("[data-composition-id='04-board']")
          : null;
        var scope = root || document;
        var q = function (sel) {
          return scope.querySelectorAll(sel);
        };
        var one = function (sel) {
          return scope.querySelector(sel);
        };

        /* ---------- Scene 1 (0.0-1.8s) : plate holds dead still, the label sets in ---------- */
        /* The board plate carries Frame 3's end state: x 960 / y 540, scale 1, opacity 1.
           It is deliberately never tweened — no entrance, no push, no drift. */

        tl.fromTo(
          "#bd-accent-line",
          { scaleX: 0, opacity: 1 },
          { scaleX: 1, opacity: 1, duration: 0.5, ease: "power3.out" },
          0.35,
        );
        tl.fromTo(
          "#bd-label",
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.62, ease: "power2.out" },
          0.55,
        );

        /* ---------- Scene 2 (1.8-3.8s) : the per-person columns light left to right ---------- */

        var washes = q(".bd-wash");
        var pills = q(".bd-pill");
        var sweeps = q(".bd-sweep");
        var rules = q(".bd-rule");
        var boxes = q(".bd-countbox");
        var sweepTravel = [341, 656, 656, 656, 341]; /* column width + 40 */
        var at = [1.85, 2.15, 2.45, 2.75, 3.05];

        for (var i = 0; i < at.length; i += 1) {
          var t = at[i];
          tl.fromTo(
            washes[i],
            { opacity: 0 },
            { opacity: 1, duration: 0.55, ease: "power2.out" },
            t,
          );
          tl.fromTo(
            pills[i],
            { opacity: 0 },
            { opacity: 1, duration: 0.32, ease: "power2.out" },
            t,
          );
          tl.fromTo(
            sweeps[i],
            { x: -260, opacity: 1 },
            { x: sweepTravel[i], opacity: 1, duration: 0.62, ease: "power2.inOut" },
            t,
          );
          tl.fromTo(
            rules[i],
            { scaleX: 0, opacity: 1 },
            { scaleX: 1, opacity: 1, duration: 0.46, ease: "power3.out" },
            t + 0.08,
          );
          tl.fromTo(
            boxes[i],
            { scale: 0.72, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.44, ease: "power3.out" },
            t + 0.2,
          );
        }

        /* ---------- Scene 3 (3.8-5.6s) : OUTSTANDING re-tallies to 35, meeting column last ---------- */

        tl.fromTo(
          "#bd-stat-ring",
          { opacity: 0, scale: 1.05 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
          3.6,
        );
        tl.fromTo(
          "#bd-num-patch",
          { opacity: 0 },
          { opacity: 1, duration: 0.18, ease: "power1.inOut" },
          3.62,
        );

        /* The count itself: a direct innerText tween so every seeked frame renders
           the right figure without relying on callbacks. Lands on the 35 the real
           board actually shows. */
        var numEl = one("#bd-num");
        tl.fromTo(
          numEl,
          { innerText: 0 },
          {
            innerText: 35,
            snap: { innerText: 1 },
            duration: 1.15,
            ease: "power2.out",
          },
          3.8,
        );
        tl.fromTo(
          numEl,
          { scale: 0.45, opacity: 0 },
          { scale: 1, opacity: 1, duration: 1.15, ease: "power2.out" },
          3.8,
        );

        tl.fromTo(
          "#bd-meet-ring",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" },
          4.85,
        );
        tl.fromTo(
          "#bd-meet-wash",
          { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.75, ease: "power3.out" },
          4.85,
        );
        tl.fromTo(
          "#bd-slot-box",
          { opacity: 0, scale: 0.62 },
          { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
          5.15,
        );

        /* ---------- Scene 4 (5.6-8.0s) : resolved and still; only the LISTENING pip breathes ---------- */

        /* The column light settles back so the real board reads again; the rules,
           the count brackets and the two rings stay. Not an exit - a resting level. */
        tl.fromTo(
          [".bd-wash", ".bd-pill"],
          { opacity: 1 },
          {
            opacity: 0.5,
            duration: 0.9,
            ease: "power2.inOut",
            immediateRender: false,
          },
          5.25,
        );

        var pulses = [5.7, 6.25, 6.8, 7.35];
        var ringIds = ["#bd-ring-a", "#bd-ring-b"];

        /* Stable resting state so any seek before the first pulse is correct. */
        tl.set("#bd-pip", { scale: 1 }, 0);
        tl.set(ringIds, { scale: 0.18, opacity: 0 }, 0);

        for (var p = 0; p < pulses.length; p += 1) {
          var tp = pulses[p];
          tl.fromTo(
            ringIds[p % 2],
            { scale: 0.18, opacity: 0.8 },
            {
              scale: 1,
              opacity: 0,
              duration: 0.64,
              ease: "power2.out",
              immediateRender: false,
            },
            tp,
          );
          tl.fromTo(
            "#bd-pip",
            { scale: 1 },
            { scale: 1.5, duration: 0.16, ease: "power2.out", immediateRender: false },
            tp,
          );
          tl.fromTo(
            "#bd-pip",
            { scale: 1.5 },
            { scale: 1, duration: 0.34, ease: "power2.inOut", immediateRender: false },
            tp + 0.16,
          );
        }

        window.__timelines["04-board"] = tl;
      })();
