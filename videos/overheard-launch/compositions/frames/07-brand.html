    <script>
      (function () {
        "use strict";

        var root = document.getElementById("root");
        var rings = root.querySelector("#brand07-rings");
        var ink = root.querySelector("#brand07-ink");
        var wordmark = root.querySelector("#brand07-wordmark");
        var pip = root.querySelector("#brand07-pip");
        var words = Array.prototype.slice.call(root.querySelectorAll(".brand07-word"));

        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });

        /* ---------------------------------------------------------------
           Scene 1 (0.0-1.5s) — the ink block rises into the centre of the
           bg ground and the wordmark settles inside it on a long tail.
           Calm-settle spring-pop entrance: power3/power4 out, no overshoot.
        ---------------------------------------------------------------- */
        tl.fromTo(
          rings,
          { opacity: 0, scale: 0.94 },
          { opacity: 1, scale: 1, duration: 1.6, ease: "power2.out" },
          0,
        );

        tl.fromTo(
          ink,
          { y: 46, scale: 0.986, opacity: 0 },
          { y: 0, scale: 1, opacity: 1, duration: 0.72, ease: "power3.out" },
          0,
        );

        tl.fromTo(
          wordmark,
          { y: 40, opacity: 0 },
          { y: 0, opacity: 1, duration: 1.15, ease: "power4.out" },
          0.26,
        );

        /* ---------------------------------------------------------------
           Scene 2 (1.5-3.0s) — the product's own line fades up beneath the
           block, on the wordmark's own left margin, left-to-right.
        ---------------------------------------------------------------- */
        words.forEach(function (word, index) {
          tl.fromTo(
            word,
            { y: 22, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.82, ease: "power3.out" },
            1.52 + index * 0.05,
          );
        });

        /* ---------------------------------------------------------------
           Scene 3 (3.0-4.0s) — a single primary pip sets to the left of the
           wordmark and stays lit. Then the film holds still and stops.
        ---------------------------------------------------------------- */
        tl.fromTo(
          pip,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.44, ease: "power3.out" },
          3.02,
        );

        window.__timelines["07-brand"] = tl;
