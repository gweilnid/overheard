  <script>
    (function () {
      var DUR = 4;

      var inkA = document.getElementById("f01-hook-ink-a");
      var inkB = document.getElementById("f01-hook-ink-b");
      var inkC = document.getElementById("f01-hook-ink-c");
      var inkD = document.getElementById("f01-hook-ink-d");
      var setup = document.getElementById("f01-hook-setup");

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // ——— Scene 1 (0.0–1.5s) — line one mask-ups in, row by row ———
      // the ink rides up inside its overflow-hidden row; no CSS transform on the
      // ink itself, so GSAP owns the whole transform string.
      tl.fromTo(
        inkA,
        { yPercent: 115 },
        { yPercent: 0, duration: 0.85, ease: "expo.out" },
        0,
      );
      tl.fromTo(
        inkB,
        { yPercent: 115 },
        { yPercent: 0, duration: 0.85, ease: "expo.out" },
        0.42,
      );

      // ——— Scene 2 (1.5–2.9s) — once the sentence closes, the setup drops to the
      // back depth layer so "is in the chat." owns the read. ———
      tl.fromTo(
        setup,
        { opacity: 1 },
        { opacity: 0.52, duration: 0.45, ease: "power2.out" },
        2.3,
      );

      // ——— discrete-text-sequence engine: whole-line state swaps at time
      // thresholds. Scene 2's line and Scene 3's clause arrive by HARD CUT — no
      // fade, no slide. Authored as a sparse state array, emitted as zero-duration
      // property writes so the swap is exact under frame-by-frame seeking (a
      // callback-driven driver is suppressed by GSAP on seek).
      var STATES = [
        { t: 0.0, c: 0, d: 0 },
        { t: 1.5, c: 1, d: 0 },
        { t: 2.9, c: 1, d: 1 },
      ];

      for (var i = 0; i < STATES.length; i++) {
        tl.set(inkC, { opacity: STATES[i].c }, STATES[i].t);
        tl.set(inkD, { opacity: STATES[i].d }, STATES[i].t);
      }

      // ——— Scene 3 (2.9–4.0s) — the frame holds dead still: no push, no drift,
      // no exit. An inert hold keeps the timeline the full frame length. ———
      tl.to({ hold: 0 }, { hold: 1, duration: DUR - 2.9, ease: "none" }, 2.9);

      window.__timelines["01-hook"] = tl;
    })();
