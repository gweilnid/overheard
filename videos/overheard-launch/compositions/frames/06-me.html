    (function () {
      "use strict";

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var $ = function (id) {
        return document.getElementById(id);
      };
      var panel = $("me-panel");
      var out = $("me-out");
      var msg = $("me-msg");
      var keys = $("me-keys");
      var toast = $("me-toast");
      var caret = $("me-caret");
      var inputText = $("me-input-text");
      var placeholder = $("me-placeholder");
      var board = $("me-board");
      var veil = $("me-veil");
      var strike = $("me-strike");
      var plane = $("me-plane");
      var bigA = document.querySelectorAll("#me-bigcount .bc-a, #me-colcount .bc-a");
      var bigB = document.querySelectorAll("#me-bigcount .bc-b, #me-colcount .bc-b");
      var patches = document.querySelectorAll("#root .me-patch");
      var head5 = $("me-head-5");
      var head4 = $("me-head-4");

      var items = [];
      var keyEls = [];
      var i;
      for (i = 1; i <= 5; i += 1) {
        items.push($("me-item-" + i));
        keyEls.push($("me-key-" + i));
      }

      // Every "after the edit" label starts hidden and its "before" twin visible.
      // Both live in the same slot, so the swap never reflows the message.
      var na = document.querySelectorAll("#root .na");
      var nb = document.querySelectorAll("#root .nb");

      // ── resting state ──────────────────────────────────────────────────────
      // Immediate gsap.set, NOT a zero-duration set at position 0: the latter does
      // not render while the playhead sits exactly at 0, so frame 0 would show
      // every hidden element.
      gsap.set(panel, { opacity: 0, y: 16 });
      gsap.set(out, { opacity: 0, scale: 0.92, transformOrigin: "100% 100%" });
      gsap.set(msg, { opacity: 0, y: 14, display: "none" });
      gsap.set(items, { opacity: 0 });
      gsap.set(keyEls, { opacity: 0, y: 8 });
      gsap.set(keys, { display: "none" });
      gsap.set(toast, { opacity: 0, y: -22 });
      gsap.set(head5, { opacity: 1 });
      gsap.set(head4, { opacity: 0 });
      gsap.set(na, { opacity: 1 });
      gsap.set(nb, { opacity: 0 });
      gsap.set(caret, { opacity: 0 });
      gsap.set(placeholder, { opacity: 1 });
      gsap.set(inputText, { opacity: 1, innerText: "" });
      gsap.set(board, { opacity: 0 });
      gsap.set(patches, { opacity: 0 });
      gsap.set(bigA, { opacity: 1 });
      gsap.set(bigB, { opacity: 0 });
      gsap.set(veil, { opacity: 0 });
      gsap.set(strike, { scaleX: 0 });
      gsap.set(plane, { opacity: 0, x: 900, y: 690, scale: 0.55, rotation: -18,
                        transformOrigin: "50% 50%" });

      // ── Scene 1 (0.0–1.6s) — the private chat settles ──────────────────────
      tl.to(panel, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.06);

      // ── Scene 2 (1.6–2.8s) — /me types and sends ───────────────────────────
      // Discrete tl.set writes, never an onUpdate driver: plain seek() suppresses
      // callbacks, so a driver-based typewriter renders empty under the renderer.
      var TYPED = ["", "/", "/m", "/me"];
      var TYPE_AT = [1.6, 1.62, 1.78, 1.94];
      for (i = 0; i < TYPED.length; i += 1) {
        tl.set(inputText, { innerText: TYPED[i] }, TYPE_AT[i]);
      }
      tl.set(placeholder, { opacity: 0 }, 1.6);
      tl.set(caret, { opacity: 1 }, 1.6);

      // caret blink — a finite ladder of discrete writes, seek-safe in both
      // directions (no repeat/yoyo, which the renderer cannot sample).
      var b;
      for (b = 0; b < 34; b += 1) {
        tl.set(caret, { opacity: b % 2 === 0 ? 1 : 0.15 }, 1.6 + b * 0.24);
      }

      // send
      tl.set(inputText, { innerText: "" }, 2.42);
      tl.set(placeholder, { opacity: 1 }, 2.42);
      tl.to(out, { opacity: 1, scale: 1, duration: 0.34, ease: "power3.out" }, 2.42);

      // ── Scene 3 (2.8–5.2s) — the digest arrives and reads line by line ─────
      tl.set(msg, { display: "block" }, 2.9);
      tl.to(msg, { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" }, 2.9);
      tl.to(items, { opacity: 1, duration: 0.3, stagger: 0.27, ease: "power2.out" }, 3.34);

      // ── Scene 4 (5.2–6.6s) — the inline keyboard ──────────────────────────
      tl.set(keys, { display: "flex" }, 5.24);
      tl.to(keyEls, { opacity: 1, y: 0, duration: 0.26, stagger: 0.1, ease: "power2.out" }, 5.24);

      // ── Scene 5 (6.6–8.4s) — Done: 1 is pressed; the message edits in place ─
      tl.to(keyEls[1], { scale: 0.975, duration: 0.1, ease: "power2.out" }, 6.72);
      tl.to(keyEls[1], { scale: 1, duration: 0.16, ease: "power2.out" }, 6.82);

      tl.to(toast, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 6.9);

      // the real bot edits the SAME message: item 1 leaves, the rest renumber
      tl.to(items[1], { opacity: 0, duration: 0.22, ease: "power2.out" }, 7.3);
      tl.to(items[1], { height: 0, duration: 0.42, ease: "power3.inOut" }, 7.42);
      tl.to(keyEls[1], { opacity: 0, duration: 0.22, ease: "power2.out" }, 7.3);
