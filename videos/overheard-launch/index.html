<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F1F1F4;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="4.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-group"
        class="scene"
        data-composition-id="02-group"
        data-composition-src="compositions/frames/02-group.html"
        data-start="4"
        data-duration="9"
        data-track-index="1"
      ></div>

      <div
        id="el-03-mark"
        class="scene"
        data-composition-id="03-mark"
        data-composition-src="compositions/frames/03-mark.html"
        data-start="13"
        data-duration="10.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-board"
        class="scene"
        data-composition-id="04-board"
        data-composition-src="compositions/frames/04-board.html"
        data-start="23"
        data-duration="8"
        data-track-index="1"
      ></div>

      <div
        id="el-05-ask"
        class="scene"
        data-composition-id="05-ask"
        data-composition-src="compositions/frames/05-ask.html"
        data-start="31"
        data-duration="10"
        data-track-index="0"
      ></div>

      <div
        id="el-06-me"
        class="scene"
        data-composition-id="06-me"
        data-composition-src="compositions/frames/06-me.html"
        data-start="41"
        data-duration="10.5"
        data-track-index="1"
      ></div>

      <div
        id="el-07-point"
        class="scene"
        data-composition-id="07-point"
        data-composition-src="compositions/frames/07-point.html"
        data-start="51"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-08-brand"
        class="scene"
        data-composition-id="08-brand"
        data-composition-src="compositions/frames/08-brand.html"
        data-start="56"
        data-duration="4"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.fromTo("#el-02-group", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4);
        tl.to("#el-03-mark", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.fromTo("#el-04-board", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 23);
        tl.to("#el-06-me", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 51);
        tl.fromTo("#el-07-point", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 51);
        tl.to("#el-07-point", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 56);
        tl.fromTo("#el-08-brand", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 56);
        tl.to({}, { duration: 60 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
